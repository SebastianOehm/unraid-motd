name: Feature request
description: Suggest a new module, option or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Planned ideas are collected in the [roadmap](https://github.com/SebastianOehm/unraid-motd/blob/main/ROADMAP.md), please check it and the [open issues](https://github.com/SebastianOehm/unraid-motd/issues) first.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you missing or what bothers you today?
      placeholder: When I log in, I would like to see ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it look or behave? Example output or config snippets are welcome.
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Type of change
      options:
        - New module
        - New option for an existing module
        - Layout / display
        - Settings page (webGUI)
        - Command line
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today or other approaches you thought about.
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself and open a pull request
          required: false
