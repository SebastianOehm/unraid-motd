on:
  release:
    types:
      - created

permissions:
  contents: write

env:
  FILE_NAME: unraid-motd
  # The tag is used in the download URL, so the plugin version must match it.
  VERSION: ${{ github.event.release.tag_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tag

      - uses: actions/checkout@v4
        with:
          path: main
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tag/go.mod
          cache-dependency-path: tag/go.sum

      - name: Build application
        run: |
          cd tag
          mkdir -p src/usr/local/bin
          go get .
          CGO_ENABLED=0 go build -o src/usr/local/bin/motd

      - id: build_files
        run: |
          mkdir release
          cd tag/src
          tar --owner=0 --group=0 -cJf ../../release/${FILE_NAME}-${VERSION}-amd64-1.txz *
          cd ../../release
          sha256sum ${FILE_NAME}-${VERSION}-amd64-1.txz | awk '{print $1}' > ${FILE_NAME}-${VERSION}-amd64-1.txz.sha256
          echo "checksum=$(cat ${FILE_NAME}-${VERSION}-amd64-1.txz.sha256)" >> $GITHUB_OUTPUT

      - uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: release/*
          overwrite: true

      - name: Add checksum to release description
        uses: djn24/add-comment-to-release@v1
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          comment: |-
            ${{ env.FILE_NAME }}-${{ env.VERSION }}-amd64-1.txz : ${{ steps.build_files.outputs.checksum }}

      # Template variables go through a JSON data file, so a multi-line
      # changelog can't break the key=value parsing of the action's variables.
      - name: Prepare template data
        run: |
          jq --arg version "$VERSION" \
             --arg checksum "$CHECKSUM" \
             --arg changelog "$CHANGELOG" \
             '. + {version: $version, checksum: $checksum, changelog: $changelog}' \
             main/plugin/motd.json > plugin-data.json
        env:
          CHECKSUM: ${{ steps.build_files.outputs.checksum }}
          CHANGELOG: ${{ github.event.release.body }}

      - name: Template
        uses: cuchi/jinja2-action@0264c440d5561d32eee3d8239a9a637a96eb5a61
        with:
          template: main/plugin/motd.j2
          output_file: main/plugin/motd.plg
          data_file: plugin-data.json

      - name: Commit plugin file
        run: |
          cd main
          gh api graphql \
            -F githubRepository=$GITHUB_REPOSITORY \
            -F branchName=$BRANCH \
            -F expectedHeadOid=$(git rev-parse HEAD) \
            -F commitMessage="release: update plugin file for ${VERSION}" \
            -F pluginFile[path]="plugin/motd.plg" -F pluginFile[contents]=$(base64 -w0 plugin/motd.plg) \
            -F 'query=@.github/api/createCommitOnBranch.gql'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: "main"
